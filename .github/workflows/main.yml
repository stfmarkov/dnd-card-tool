name: Wails Build & Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    strategy:
      fail-fast: false # Prevents Windows from being canceled if Linux errors out
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: wails-app-linux
            flags: "-tags webkit2_41" 
          - os: windows-latest
            platform: windows
            output: wails-app-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: bash
        run: |
          # Add Go bin to path explicitly for runner environments
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Install frontend dependencies if package.json exists
          if [ -d "frontend" ]; then
            cd frontend && npm install && cd ..
          fi
          
          wails build -platform ${{ matrix.platform }}/amd64 ${{ matrix.flags }}

      - name: Rename Binary for Clarity
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv build/bin/*.exe build/bin/${{ matrix.output }} || true
          else
            mv build/bin/* build/bin/${{ matrix.output }} || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wails-artifact-${{ matrix.platform }} # Unique name per platform required by v4
          path: build/bin/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required permission to create releases and upload assets
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: wails-artifact-linux
          path: ./dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: wails-artifact-windows
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
