name: Wails Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false # Prevents Windows from being canceled if Linux errors out
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: wails-app-linux
          - os: windows-latest
            platform: windows
            output: wails-app-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: bash
        run: |
          # Add Go bin to path explicitly for runner environments
          export PATH=$PATH:$(go env GOPATH)/bin
          cd frontend && npm install && cd ..
          wails build -platform ${{ matrix.platform }}/amd64

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv build/bin/*.exe build/bin/${{ matrix.output }} || true
          else
            mv build/bin/* build/bin/${{ matrix.output }} || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: wails-app-linux
          path: ./dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: wails-app-windows.exe
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
